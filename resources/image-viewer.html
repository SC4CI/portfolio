<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Viewer</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090a0a;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif}.bar{height:54px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:7px 14px;background:#0b0c0c;border-bottom:1px solid #2c2719}.bar button{height:38px;min-width:42px;border:1px solid #5b491d;background:#13130f;color:#e5c458;border-radius:9px;font:inherit;font-weight:800;cursor:pointer}.viewer-scroll{height:calc(100% - 54px);overflow:auto;padding:18px;scrollbar-width:none}.viewer-scroll::-webkit-scrollbar{display:none}.sheet{min-width:100%;display:flex;justify-content:center;align-items:flex-start}.sheet img{display:block;width:min(100%,1500px);height:auto;background:#fff;box-shadow:0 12px 42px #0009;transform-origin:top center;user-select:none;-webkit-user-drag:none}
/* beta30-scroll-hide */html,body,[data-scroll-root]{scrollbar-width:none!important;-ms-overflow-style:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar,[data-scroll-root]::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}</style></head><body data-scroll-root><div class="bar"><button id="minus">−</button><button id="fit">100%</button><button id="plus">+</button></div><div class="viewer-scroll" id="scroll" data-scroll-root><div class="sheet"><img id="img" alt="Document" draggable="false"></div></div>
<script>const q=new URLSearchParams(location.search);let src=q.get('src')||'';if(src.startsWith('assets/'))src='../'+src;document.getElementById('img').src=src;let z=.85;const im=document.getElementById('img'),fit=document.getElementById('fit');function apply(){im.style.width=`min(${Math.round(z*100)}%, ${Math.round(1500*z)}px)`;fit.textContent=Math.round(z*100)+'%';return z}window.portfolioViewerSetZoom=v=>{z=Math.max(.45,Math.min(1.8,Number(v)||1));return apply()};document.getElementById('plus').onclick=()=>{z=Math.min(1.8,z+.08);apply()};document.getElementById('minus').onclick=()=>{z=Math.max(.45,z-.08);apply()};fit.onclick=()=>{z=.85;apply()};apply();</script></body></html>
